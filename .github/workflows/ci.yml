name: LUNA checks

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # Every Monday at 04:23 UTC
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production npm dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  mobile-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright and Chromium
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start Vite preview server
        working-directory: frontend
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/luna-preview.log 2>&1 &
          echo $! > /tmp/luna-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/luna-preview.log
          exit 1
      - name: Test responsive layouts in Chromium
        working-directory: frontend
        run: node tests/mobile-layout.mjs


  report-failure:
    name: Create GitHub problem report
    if: ${{ always() && (needs.backend-tests.result == 'failure' || needs.frontend-build.result == 'failure' || needs.dependency-security.result == 'failure' || needs.mobile-browser-tests.result == 'failure') }}
    needs:
      - backend-tests
      - frontend-build
      - dependency-security
      - mobile-browser-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Create or update a deduplicated issue with failing checks
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, per_page: 100
            });
            const failed = jobs.filter(job => job.conclusion === 'failure');
            const summary = [
              '## Automated LUNA problem report',
              '',
              `- **Workflow:** ${context.workflow}`,
              `- **Branch:** ${context.ref.replace('refs/heads/', '')}`,
              `- **Commit:** ${context.sha}`,
              `- **Run:** [View full logs](${runUrl})`,
              `- **Triggered by:** ${context.eventName}`,
              '',
              '### Failed jobs',
              ...(failed.length ? failed.map(job => `- **${job.name}** — [job logs](${job.html_url})`) : ['- One or more checks failed; open the workflow run to inspect the failed step.']),
              '',
              '### How to investigate',
              '1. Open the failed job log above.',
              '2. Find the first actual error (later errors may be consequences).',
              '3. Reproduce locally when possible, fix the root cause, and push a new commit.',
              '',
              '> This report is generated by GitHub Actions. It identifies failing checks; it does not prove every reported failure is a code defect.'
            ].join('\n');
            const title = `Automated test failure: ${context.ref.replace('refs/heads/', '')}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const issue = existing.find(item => !item.pull_request && item.title === title);
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: summary });
              core.info(`Added latest failure details to existing issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body: summary,
                labels: ['bug']
              }).catch(async error => {
                if (error.status !== 404 && error.status !== 422) throw error;
                return github.rest.issues.create({ owner, repo, title, body: summary });
              });
              core.info(`Created problem report issue #${created.data.number}`);
            }
